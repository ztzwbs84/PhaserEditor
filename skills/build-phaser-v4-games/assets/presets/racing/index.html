<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121618" />
    <meta name="description" content="__GAME_TITLE_HTML__, a Phaser 4 top-down racing game." />
    <link rel="icon" href="./assets/racer.svg" type="image/svg+xml" />
    <title>__GAME_TITLE_HTML__</title>
  </head>
  <body>
    <main id="app">
      <header class="game-bar" aria-label="Game controls">
        <strong class="game-title">__GAME_TITLE_HTML__</strong>
        <div class="game-stats" aria-label="Current race">
          <span><span class="stat-label">Gates</span> <output id="progress-value">0</output></span>
          <span><span class="stat-label">Lap</span> <output id="auxiliary-value">1</output></span>
          <span><span class="stat-label">Chassis</span> <output id="pressure-value">3</output></span>
        </div>
        <div class="game-actions">
          <button id="pause-button" type="button" aria-pressed="false">Pause</button>
          <button id="sound-button" type="button" aria-pressed="false">Sound on</button>
          <button id="restart-button" type="button">Restart</button>
        </div>
      </header>
      <div id="game" tabindex="0" aria-label="__GAME_TITLE_HTML__ game canvas"></div>
      <section class="game-telemetry racing-telemetry" aria-label="Current race">
        <div class="racing-objective">
          <span class="telemetry-label">Race control</span>
          <output id="racing-objective">Accelerate to Gate 1</output>
        </div>
        <dl class="racing-details">
          <div><dt>Gate</dt><dd><output id="racing-gate">1 / 4</output></dd></div>
          <div><dt>Speed</dt><dd><output id="racing-speed">0</output></dd></div>
          <div><dt>Score</dt><dd><output id="racing-score">0</output></dd></div>
        </dl>
      </section>
      <p id="game-status" class="sr-only" aria-live="polite">Loading game</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

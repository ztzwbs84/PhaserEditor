<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17151d" />
    <meta name="description" content="__GAME_TITLE_HTML__, a Phaser 4 platform game." />
    <link rel="icon" href="./assets/relic.svg" type="image/svg+xml" />
    <title>__GAME_TITLE_HTML__</title>
  </head>
  <body>
    <main id="app">
      <header class="game-bar" aria-label="Game controls">
        <strong class="game-title">__GAME_TITLE_HTML__</strong>
        <div class="game-stats" aria-label="Current ascent">
          <span><span class="stat-label">Relics</span> <output id="progress-value">0</output></span>
          <span><span class="stat-label">Time</span> <output id="auxiliary-value">75</output></span>
          <span><span class="stat-label">Hearts</span> <output id="pressure-value">3</output></span>
        </div>
        <div class="game-actions">
          <button id="pause-button" type="button" aria-pressed="false">Pause</button>
          <button id="sound-button" type="button" aria-pressed="false">Sound on</button>
          <button id="restart-button" type="button">Restart</button>
        </div>
      </header>
      <div id="game" tabindex="0" aria-label="__GAME_TITLE_HTML__ game canvas"></div>
      <section class="game-telemetry ascent-telemetry" aria-label="Current ascent">
        <div class="ascent-objective">
          <span class="telemetry-label">Objective</span>
          <output id="ascent-objective">Reach the next relic</output>
        </div>
        <dl class="ascent-details">
          <div><dt>Chain</dt><dd><output id="ascent-chain">x1</output></dd></div>
          <div><dt>Height</dt><dd><output id="ascent-height">0m</output></dd></div>
          <div><dt>Points</dt><dd><output id="ascent-points">0</output></dd></div>
        </dl>
      </section>
      <p id="game-status" class="sr-only" aria-live="polite">Loading game</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10171c" />
    <meta name="description" content="__GAME_TITLE_HTML__, a Phaser 4 arcade game." />
    <link rel="icon" href="./assets/shard.svg" type="image/svg+xml" />
    <title>__GAME_TITLE_HTML__</title>
  </head>
  <body>
    <main id="app">
      <header class="game-bar" aria-label="Game controls">
        <strong class="game-title">__GAME_TITLE_HTML__</strong>
        <div class="game-stats" aria-label="Current run">
          <span><span class="stat-label">Score</span> <output id="progress-value">0</output></span>
          <span><span class="stat-label">Time</span> <output id="auxiliary-value">60</output></span>
          <span><span class="stat-label">Shield</span> <output id="pressure-value">3</output></span>
        </div>
        <div class="game-actions">
          <button id="pause-button" type="button" aria-pressed="false">Pause</button>
          <button id="sound-button" type="button" aria-pressed="false">Sound on</button>
          <button id="restart-button" type="button">Restart</button>
        </div>
      </header>
      <div id="game" aria-label="__GAME_TITLE_HTML__ game canvas"></div>
      <section class="game-telemetry" aria-label="Current mission">
        <div class="mission-objective">
          <span class="telemetry-label">Mission</span>
          <output id="mission-objective">Collect nearest signal</output>
        </div>
        <dl class="mission-details">
          <div><dt>Combo</dt><dd><output id="mission-combo">x1</output></dd></div>
          <div><dt>Level</dt><dd><output id="mission-level">1</output></dd></div>
          <div><dt>Next level</dt><dd><output id="mission-next-level">150</output></dd></div>
        </dl>
      </section>
      <p id="game-status" class="sr-only" aria-live="polite">Loading game</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
